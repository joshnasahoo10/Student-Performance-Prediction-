<!DOCTYPE html>

<html>
<head>
    <title>Student Performance Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

```
    <h2 class="text-center mb-4">🎓 Student Performance Predictor</h2>

    {% if error %}
    <div class="alert alert-danger text-center">
        {{ error }}
    </div>
    {% endif %}

    <form action="/predict" method="post">
        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Age</label>
                <input type="number" name="age" class="form-control" required>
            </div>

            <!-- 🔥 FIXED STUDY TIME -->
            <div class="col-md-6 mb-3">
                <label>Study Time</label>
                <select name="studytime" class="form-control" required>
                    <option value="">Select</option>
                    <option value="1">Less than 2 hours</option>
                    <option value="2">2 to 5 hours</option>
                    <option value="3">5 to 10 hours</option>
                    <option value="4">More than 10 hours</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Past Failures</label>
                <input type="number" name="failures" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Absences</label>
                <input type="number" name="absences" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Grade 1 (G1)</label>
                <input type="number" name="G1" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Grade 2 (G2)</label>
                <input type="number" name="G2" class="form-control" required>
            </div>

        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Predict</button>
        </div>

    </form>

</div>
```

</div>

</body>
</html>
